<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/jpeg" href="/static/images/nnra-logo.jpg">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password - NIRPR RSO Examination Portal</title>
<link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="crest"><img src="/static/images/nnra-logo.jpg" alt="NNRA logo"></div>
    <div>
      NIRPR RSO Examination Portal
      <div class="brand-sub">Password Reset</div>
    </div>
  </div>
</div>

<div class="container narrow">
  <div class="card" id="formCard">
    <div id="alertBox"></div>
    <div class="row between" style="align-items:flex-start;">
      <div>
        <h1 class="mt-0 mb-0">Choose a new password</h1>
        <p class="subtitle" style="margin-top:4px;">Enter and confirm your new password below.</p>
      </div>
      <span class="badge blue hidden" id="countdownBadge" style="white-space:nowrap;"></span>
    </div>
    <form id="resetForm">
      <label>New password</label>
      <input type="password" id="pw1" required minlength="8" autocomplete="new-password" />
      <label>Confirm new password</label>
      <input type="password" id="pw2" required minlength="8" autocomplete="new-password" />
      <button class="btn block" type="submit" style="margin-top:18px;" id="submitBtn">Reset password</button>
    </form>
  </div>
  <div class="card hidden" id="doneCard" style="text-align:center;">
    <h1>Password updated</h1>
    <p class="subtitle" id="doneMessage"></p>
    <a href="/" class="btn">Go to log in</a>
  </div>
  <div class="footer-note">&copy; NIRPR / NNRA &mdash; Radiation Safety Officer Certification Examination Platform</div>
</div>

<script>
const API = "/api";
const token = new URLSearchParams(window.location.search).get("token");
function showAlert(msg, type) { document.getElementById("alertBox").innerHTML = `<div class="alert ${type}">${msg}</div>`; }

if (!token) showAlert("Invalid or missing reset link. Please request a new one from the Forgot Password page.", "error");

let countdownInterval = null;

function formatRemaining(seconds) {
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;
  if (h > 0) return `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
  return `${m}:${String(s).padStart(2, "0")}`;
}

function disableForm(message) {
  showAlert(message, "error");
  document.getElementById("resetForm").querySelectorAll("input, button").forEach(el => el.disabled = true);
}

function startCountdown(secondsRemaining) {
  const badge = document.getElementById("countdownBadge");
  badge.classList.remove("hidden");
  let remaining = secondsRemaining;

  function tick() {
    if (remaining <= 0) {
      clearInterval(countdownInterval);
      badge.textContent = "Link expired";
      badge.className = "badge red";
      disableForm("This reset link has expired. Please request a new one from the Forgot Password page.");
      return;
    }
    badge.textContent = `Link expires in ${formatRemaining(remaining)}`;
    badge.className = remaining <= 120 ? "badge red" : remaining <= 300 ? "badge gold" : "badge blue";
    remaining--;
  }
  tick();
  countdownInterval = setInterval(tick, 1000);
}

async function checkTokenStatus() {
  if (!token) return;
  try {
    const res = await fetch(`${API}/auth/reset-password/token-status?token=${encodeURIComponent(token)}`);
    const data = await res.json();
    if (!data.valid) {
      disableForm("This reset link is invalid or has already expired. Please request a new one from the Forgot Password page.");
      return;
    }
    startCountdown(data.seconds_remaining);
  } catch (e) {
    // Non-fatal — the countdown is a convenience; submission still re-validates server-side.
  }
}
checkTokenStatus();

document.getElementById("resetForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const pw1 = document.getElementById("pw1").value;
  const pw2 = document.getElementById("pw2").value;
  if (pw1 !== pw2) { showAlert("Passwords do not match.", "error"); return; }
  const btn = document.getElementById("submitBtn");
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Updating...';
  try {
    const res = await fetch(`${API}/auth/reset-password`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token, new_password: pw1, confirm_password: pw2 }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Could not reset password");
    if (countdownInterval) clearInterval(countdownInterval);
    document.getElementById("formCard").classList.add("hidden");
    document.getElementById("doneCard").classList.remove("hidden");
    document.getElementById("doneMessage").textContent = data.detail;
  } catch (err) {
    showAlert(err.message, "error");
  } finally {
    btn.disabled = false; btn.textContent = "Reset password";
  }
});
</script>
</body>
</html>
