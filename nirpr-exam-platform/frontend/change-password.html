<!DOCTYPE html>
<html lang="en"><head>
<link rel="icon" type="image/jpeg" href="/static/images/nnra-logo.jpg"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Change Temporary Password - NIRPR</title><link rel="stylesheet" href="/static/css/style.css"></head>
<body><div class="topbar"><div class="brand"><div class="crest"><img src="/static/images/nnra-logo.jpg" alt="NNRA logo"></div><div>NIRPR RSO Examination Portal<div class="brand-sub">Secure your new account</div></div></div></div>
<main class="container narrow"><div class="card"><div id="alertBox"></div><h1 class="mt-0">Change your temporary password</h1><p class="subtitle">An administrator created this account with a temporary password. Choose a private password before continuing.</p>
<form id="passwordForm"><label>Current temporary password</label><input type="password" id="currentPassword" required autocomplete="current-password">
<label>New password</label><input type="password" id="newPassword" required minlength="8" autocomplete="new-password">
<label>Confirm new password</label><input type="password" id="confirmPassword" required minlength="8" autocomplete="new-password">
<button class="btn block" id="saveBtn" style="margin-top:18px">Update password and continue</button></form></div></main>
<script>
const API='/api',token=localStorage.getItem('nirpr_token'),role=localStorage.getItem('nirpr_role');
if(!token)location.href=role==='candidate'?'/':'/admin-login';
document.getElementById('passwordForm').onsubmit=async event=>{event.preventDefault();const box=document.getElementById('alertBox'),button=document.getElementById('saveBtn'),newPassword=document.getElementById('newPassword').value,confirmPassword=document.getElementById('confirmPassword').value;if(newPassword!==confirmPassword){box.innerHTML='<div class="alert error">The new passwords do not match.</div>';return;}button.disabled=true;button.textContent='Updating password…';try{const response=await fetch(`${API}/auth/change-temporary-password`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},body:JSON.stringify({current_password:document.getElementById('currentPassword').value,new_password:newPassword,confirm_password:confirmPassword})}),data=await response.json();if(!response.ok)throw new Error(data.detail||'Password update failed');localStorage.setItem('nirpr_must_change_password','false');box.innerHTML=`<div class="alert success">${data.detail}</div>`;setTimeout(()=>location.href=role==='candidate'?'/candidate':'/admin',700);}catch(error){box.innerHTML=`<div class="alert error">${error.message}</div>`;button.disabled=false;button.textContent='Update password and continue';}};
</script></body></html>
