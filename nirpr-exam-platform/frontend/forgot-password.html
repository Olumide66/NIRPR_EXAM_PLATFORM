<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/jpeg" href="/static/images/nnra-logo.jpg">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Forgot Password - NIRPR RSO Examination Portal</title>
<link rel="stylesheet" href="/static/css/style.css" />
<script src="https://www.google.com/recaptcha/api.js?render=explicit" async defer></script>
<script src="/static/js/recaptcha.js"></script></head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="crest"><img src="/static/images/nnra-logo.jpg" alt="NNRA logo"></div>
    <div>
      NIRPR RSO Examination Portal
      <div class="brand-sub">Password Reset</div>
    </div>
  </div>
</div>

<div class="container narrow">
  <div class="card">
    <div id="alertBox"></div>
    <h1 class="mt-0">Forgot your password?</h1>
    <p class="subtitle">Enter your account email address and we'll send you a link to reset your password.</p>
    <form id="forgotForm">
      <label>Email address</label>
      <input type="email" id="email" required autocomplete="username" />
      <label style="margin-top:16px;">Human verification</label>
      <div id="recaptchaWidget"></div>
      <button class="btn block" type="submit" style="margin-top:18px;" id="submitBtn">Send reset link</button>
    </form>
    <div style="text-align:center; margin-top:20px; font-size:13.5px;">
      <a href="/">Back to log in</a>
    </div>
  </div>
  <div class="footer-note">&copy; NIRPR / NNRA &mdash; Radiation Safety Officer Certification Examination Platform</div>
</div>

<script>
const API = "/api";
let recaptchaWidgetId = null;
function showAlert(msg, type) { document.getElementById("alertBox").innerHTML = `<div class="alert ${type}">${msg}</div>`; }

async function renderRecaptcha() { recaptchaWidgetId = await window.nirprRenderRecaptcha(); }
renderRecaptcha();

document.getElementById("forgotForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const recaptchaToken = recaptchaWidgetId === null ? "" : grecaptcha.getResponse(recaptchaWidgetId);
  if (!recaptchaToken) { showAlert("Please complete the human verification challenge.", "error"); return; }
  const btn = document.getElementById("submitBtn");
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Sending...';
  try {
    const res = await fetch(`${API}/auth/forgot-password`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: document.getElementById("email").value.trim(), recaptcha_token: recaptchaToken }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Could not request a reset link.");
    showAlert(data.detail || "If an account exists for that email, a reset link has been sent.", "success");
    document.getElementById("forgotForm").reset();
  } catch (err) {
    showAlert(err.message || "Something went wrong. Please try again.", "error");
    if (recaptchaWidgetId !== null) grecaptcha.reset(recaptchaWidgetId);
  } finally {
    btn.disabled = false; btn.textContent = "Send reset link";
  }
});
</script>
</body>
</html>
